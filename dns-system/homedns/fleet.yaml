defaultNamespace: dns-system

helm:
  chart: oci://ghcr.io/webd97/charts/homedns
  version: 0.1.4
  values:
    blocklist:
      urls:
        - https://media.githubusercontent.com/media/zachlagden/Pi-hole-Optimized-Blocklists/main/lists/comprehensive.txt
      bootstrapDNS:
        - 9.9.9.9
        - 149.112.112.112
    gatewayAPI:
      zones: [homelab.cloudbending.dev]
      resources: [HTTPRoute]
    upstream:
      servers: [tls://9.9.9.11, tls://149.112.112.11]
      tlsServername: dns11.quad9.net
    resources:
      requests:
        cpu: 100m
    # Cluster, not the chart's default of Local: with maxSurge 0 a rollout drains the
    # announcing node's pod, and under Local that node has no local backend left, so
    # the LB IP blackholes until the replacement is Ready. Cluster lets any announcing
    # node forward to the healthy replica. The cost is client source IPs (SNAT), which
    # nothing here reads -- per-query logging is off.
    service:
      externalTrafficPolicy: Cluster
    metrics:
      serviceMonitor:
        enabled: true
        labels:
          release: kube-prometheus-stack
    replicaCount: 2
    # Surge-free: the affinity below pins pods to the two workers, so a surge pod
    # would have no node to land on and the rollout would wedge silently.
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 1
        maxSurge: 0
    # Worker nodes only. No toleration is set, so the control plane taint already
    # enforces this; the affinity makes the intent explicit and keeps the pods on the
    # same nodes the CiliumL2AnnouncementPolicy announces from. Under Cluster that
    # alignment is no longer load-bearing, but it still saves an extra hop. The
    # anti-affinity spreads the two replicas so one node loss cannot take out both.
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: homedns
