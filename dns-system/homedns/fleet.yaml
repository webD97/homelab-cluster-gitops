defaultNamespace: dns-system

helm:
  chart: oci://ghcr.io/webd97/charts/homedns
  version: 0.1.4
  values:
    blocklist:
      urls:
        - https://media.githubusercontent.com/media/zachlagden/Pi-hole-Optimized-Blocklists/main/lists/comprehensive.txt
      bootstrapDNS:
        - 9.9.9.9
        - 149.112.112.112
    gatewayAPI:
      zones: [homelab.cloudbending.dev]
      resources: [HTTPRoute]
    upstream:
      servers: [tls://9.9.9.11, tls://149.112.112.11]
      tlsServername: dns11.quad9.net
    metrics:
      serviceMonitor:
        enabled: true
    replicaCount: 2
    # Worker nodes only, and deliberately so: the Service is externalTrafficPolicy:
    # Local (chart default) and the CiliumL2AnnouncementPolicy announces the LB IP
    # only from non-control-plane nodes. Announcing nodes must therefore be exactly
    # the nodes that can host pods. No toleration is set, so the control plane taint
    # enforces this too; the affinity makes the intent explicit.
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: homedns
